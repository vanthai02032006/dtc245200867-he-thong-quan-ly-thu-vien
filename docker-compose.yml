services:
  # 1. Cơ sở dữ liệu PostgreSQL (Nằm trong mạng cô lập backend_net)
  db:
    image: postgres:17-alpine
    container_name: hethong-thu-vien-db-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thuvien}
      POSTGRES_USER: ${POSTGRES_USER:-thuvien_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ThuVien123456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net

  # Exporter đo lường chuyên sâu chỉ số CSDL PostgreSQL
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: hethong-thu-vien-postgres_exporter-1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-thuvien_user}:${POSTGRES_PASSWORD:-ThuVien123456}@db:5432/${POSTGRES_DB:-thuvien}?sslmode=disable"
    networks:
      - backend_net
      - frontend_net
    depends_on:
      - db

  # 2. Web Node.js Quản lý Thư viện (Chạy Non-root user)
  web:
    build: ./web
    container_name: hethong-thu-vien-web-1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-thuvien_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ThuVien123456}
      DB_NAME: ${POSTGRES_DB:-thuvien}
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db

  # 3. pgAdmin Quản trị DB
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hethong-thu-vien-pgadmin-1
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@thuvien.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin123456}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db

  # 4. Nginx Reverse Proxy (HTTPS + Security Headers + Rate Limit)
  nginx:
    image: nginx:alpine
    container_name: hethong-thu-vien-nginx-1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
    depends_on:
      - web

  # Exporter đo lường chuyên sâu chỉ số Nginx qua stub_status
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: hethong-thu-vien-nginx_exporter-1
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    networks:
      - frontend_net
    depends_on:
      - nginx

  # 5. Prometheus Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: hethong-thu-vien-prometheus-1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - frontend_net

  # 6. cAdvisor đo tài nguyên CPU/RAM từng Container
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: hethong-thu-vien-cadvisor-1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - frontend_net

  # 7. Grafana Visualization (Cổng 3001)
  grafana:
    image: grafana/grafana:latest
    container_name: hethong-thu-vien-grafana-1
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - frontend_net
    depends_on:
      - prometheus
      - loki

  # 8. Loki Centralized Log Storage
  loki:
    image: grafana/loki:2.9.8
    user: "0:0"
    container_name: hethong-thu-vien-loki-1
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - frontend_net

  # 9. Promtail Log Shipper
  promtail:
    image: grafana/promtail:latest
    container_name: hethong-thu-vien-promtail-1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - frontend_net
    depends_on:
      - loki

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  pgadmin_data:
  loki_data:

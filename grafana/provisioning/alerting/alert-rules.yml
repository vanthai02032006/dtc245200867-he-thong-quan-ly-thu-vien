apiVersion: 1

groups:
  - orgId: 1
    name: library-security-alerts
    folder: Security Alerts
    interval: 1m
    rules:
      - uid: library_bruteforce_login
        title: "Library - Brute force login detected"
        condition: C
        for: 0m
        annotations:
          summary: "Phát hiện nhiều lần đăng nhập thất bại liên tiếp (LOGIN_FAILED) trên Hệ thống Thư viện"
        labels:
          severity: critical
          student: DTC245200867
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: 'count_over_time({container=~".*web.*"} |= "LOGIN_FAILED" [5m])'
              queryType: range
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions: []
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              type: threshold
              refId: C
        noDataState: NoData
        execErrState: Error
